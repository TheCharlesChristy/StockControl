version: 2

# Every action in this repository is pinned to a commit SHA, which is the right
# default and also means nothing updates on its own. These schedules are what
# keep a pinned dependency from quietly becoming an unpatched one.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    open-pull-requests-limit: 5
    # One pull request per concern rather than per package: the workspace has
    # eleven projects and ungrouped updates would bury the quality gate.
    groups:
      production:
        applies-to: version-updates
        dependency-type: production
        update-types:
          - minor
          - patch
      development:
        applies-to: version-updates
        dependency-type: development
        update-types:
          - minor
          - patch
      security:
        applies-to: security-updates
        patterns:
          - "*"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    groups:
      actions:
        patterns:
          - "*"
    commit-message:
      prefix: "chore(ci)"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/London
    commit-message:
      prefix: "chore(docker)"
