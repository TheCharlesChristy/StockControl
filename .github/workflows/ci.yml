name: ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate requirements section 9 asks for: install, format check, lint,
  # typecheck, build, unit tests. Nothing else blocks a demo.
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # The dependency risk register names this as its verification step. Run it
      # here so an accepted exception has to be recorded deliberately rather than
      # arriving unnoticed with a lockfile change.
      - name: Audit dependencies for high-severity advisories
        run: pnpm audit --audit-level high

      - name: Validate Railway service configuration
        run: >-
          node -e
          "for (const path of ['infra/railway/web.railway.json', 'infra/railway/api.railway.json', 'infra/railway/bootstrap.railway.json', 'infra/railway/migrate.railway.json', 'infra/railway/worker.railway.json', 'infra/railway/recognition-core.railway.json', 'infra/railway/recognition-fusion.railway.json']) JSON.parse(require('node:fs').readFileSync(path, 'utf8'))"

      - name: Check formatting, lint, types, and the production build
        run: pnpm run quality

      # Coverage rather than a bare test run: every package declares thresholds
      # in its vitest config, and this is what makes them binding.
      - name: Run unit tests with coverage thresholds
        run: pnpm run test:coverage

  # services/recognition-core is a standalone Python project outside the
  # pnpm workspace (specification section 9.1), so it gets its own gate
  # rather than folding into `quality` above.
  recognition-core:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: services/recognition-core

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Package name varies by Ubuntu release around the 64-bit time_t
      # transition (libvips42t64 on 24.04 "noble"); try both so a future
      # runner image bump doesn't silently break this step.
      - name: Install libvips for pyvips's native decode path
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libvips42t64 \
            || sudo apt-get install --yes --no-install-recommends libvips42

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: services/recognition-core/uv.lock

      - name: Install locked dependencies
        run: uv sync --frozen --group dev

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type-check
        run: uv run mypy src tests scripts

      - name: Run unit tests
        run: uv run pytest

      # No copyleft dependency should reach a proprietary build without a
      # deliberate, reviewed decision — see package.json's own "UNLICENSED".
      - name: Check dependency licences
        run: uv run pip-licenses --fail-on="GPL;AGPL;LGPL" --partial-match

  container-images:
    name: container image (${{ matrix.runtime }})
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        runtime:
          - api
          - web
          - worker
          - recognition-core
          - recognition-fusion

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build the selected final runtime image
        run: >-
          docker build
          --build-arg RAILWAY_GIT_COMMIT_SHA="${GITHUB_SHA}"
          --build-arg RUNTIME_TARGET="${{ matrix.runtime }}"
          --tag "stockcontrol-${{ matrix.runtime }}:ci"
          .

      - name: Verify the image contract
        env:
          IMAGE: stockcontrol-${{ matrix.runtime }}:ci
          RUNTIME: ${{ matrix.runtime }}
        run: |
          runtime_user="$(docker image inspect --format '{{.Config.User}}' "$IMAGE")"
          test -n "$runtime_user"
          test "$runtime_user" != "0"
          test "$runtime_user" != "root"

          revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$IMAGE")"
          test "$revision" = "$GITHUB_SHA"

          if [ "$RUNTIME" = api ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
              'test -f apps/api/dist/main.js && test -f apps/api/dist/reset-admin-password.js && test -f apps/api/dist/setup-first-admin.js && test -f packages/platform/database/dist/bootstrap-roles.js && test -f packages/platform/database/dist/migrate.js'
          elif [ "$RUNTIME" = worker ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -c 'test -f apps/worker/dist/main.js'
          elif [ "$RUNTIME" = recognition-core ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
              'test -f /app/.venv/bin/python && test -f /app/src/recognition_core/main.py && test -d /models'
          elif [ "$RUNTIME" = recognition-fusion ]; then
            docker run --rm --entrypoint /bin/sh "$IMAGE" -c \
              'test -f /usr/local/bin/llama-server && test -x /app/docker-entrypoint.sh && test -d /models'
          fi

      - name: Smoke test the web runtime
        if: matrix.runtime == 'web'
        run: |
          container_id="$(docker run --detach --publish 18080:8080 stockcontrol-web:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 http://127.0.0.1:18080/health
          curl --fail --silent --show-error http://127.0.0.1:18080/a/client/route \
            | grep --quiet '<div id="root"></div>'
          curl --fail --silent --show-error --head http://127.0.0.1:18080/ \
            | grep --ignore-case --quiet '^Content-Security-Policy:'

          # nginx replaces rather than merges an inherited add_header set, so a
          # location with headers of its own silently loses the security set.
          # Assert it on the one location that has them, not only on the root.
          for header in Content-Security-Policy X-Content-Type-Options \
                        X-Frame-Options Strict-Transport-Security; do
            curl --fail --silent --show-error --head http://127.0.0.1:18080/health \
              | grep --ignore-case --quiet "^${header}:" \
              || { echo "::error::/health is missing ${header}"; exit 1; }
          done

          curl --fail --silent --show-error --head http://127.0.0.1:18080/ \
            | grep --ignore-case --quiet '^Strict-Transport-Security:.*includeSubDomains'

          docker exec "$container_id" nginx -T 2>&1 \
            | grep --quiet 'client_max_body_size 16m;'

      - name: Smoke test the recognition-fusion runtime
        if: matrix.runtime == 'recognition-fusion'
        run: |
          # Starting the server is itself most of the assertion. llama-server
          # loads both the language model and the multimodal projector before it
          # serves anything, so a passing /health proves the pinned runtime
          # understands this model's architecture and its projector type, and
          # that it accepted every flag the entrypoint passes. Each of those
          # failed loudly at startup or not at all, which is exactly the class of
          # break that is otherwise only discovered on deploy.
          container_id="$(docker run --detach --publish 18001:8000 \
            --env RECOGNITION_FUSION_MODEL_PATH=/models/qwen3.5-0.8b-q8-0/Qwen3.5-0.8B-Q8_0.gguf \
            --env RECOGNITION_FUSION_MMPROJ_PATH=/models/qwen3.5-0.8b-q8-0/mmproj-F16.gguf \
            --env RECOGNITION_FUSION_API_KEY=ci-not-a-secret \
            stockcontrol-recognition-fusion:ci)"
          trap 'docker logs "$container_id" 2>&1 | tail -40; docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          curl --fail --silent --show-error --retry 60 --retry-all-errors \
            --retry-delay 2 http://127.0.0.1:18001/health

          # The response contract, against the real grammar converter rather than
          # a generated approximation of it. Two things are under test that unit
          # tests cannot reach: that llama.cpp turns this schema into a grammar
          # admitting every required field, and that thinking is actually
          # suppressed. Qwen3.5 thinks by default, and a thinking pass would
          # consume the 256-token cap and return no JSON at all -- which reads
          # like a model that cannot follow a schema rather than a missing flag.
          response="$(curl --fail --silent --show-error --max-time 300 \
            --header 'content-type: application/json' \
            --header 'authorization: Bearer ci-not-a-secret' \
            --data @- http://127.0.0.1:18001/v1/chat/completions <<'REQUEST'
          {
            "model": "qwen3.5-0.8b",
            "temperature": 0,
            "max_tokens": 256,
            "messages": [
              { "role": "system", "content": "You identify a physical stock item from photographs and structured evidence. Respond with JSON matching the supplied schema only. Always emit every field in the schema; use null, an empty string, or an empty array for fields that do not apply. If you cannot tell, respond \"Unknown\"." },
              { "role": "user", "content": "Evidence: {\"candidates\":[],\"categories\":[],\"observations\":[],\"webEvidence\":[]}" }
            ],
            "response_format": {
              "type": "json_schema",
              "json_schema": {
                "name": "vlm_proposal",
                "schema": {
                  "type": "object",
                  "additionalProperties": false,
                  "required": ["kind","candidateId","manufacturer","name","partNumber","barcode","variantAttributes","evidenceImageOrdinals"],
                  "properties": {
                    "kind": { "type": "string", "enum": ["ExternalIdentity","Unknown"] },
                    "candidateId": { "type": "null", "enum": [null] },
                    "manufacturer": { "type": ["string","null"], "maxLength": 120 },
                    "name": { "type": "string", "maxLength": 120 },
                    "partNumber": { "type": ["string","null"], "maxLength": 120 },
                    "barcode": { "type": ["string","null"], "maxLength": 40 },
                    "variantAttributes": {
                      "type": "array", "maxItems": 8,
                      "items": { "type": "object", "additionalProperties": false,
                        "required": ["label","value"],
                        "properties": { "label": {"type":"string","maxLength":40}, "value": {"type":"string","maxLength":80} } }
                    },
                    "evidenceImageOrdinals": { "type": "array", "maxItems": 5, "items": {"type":"integer","minimum":1,"maximum":5} }
                  }
                }
              }
            }
          }
          REQUEST
          )"

          printf '%s' "$response" | python3 -c '
          import json, sys
          body = json.load(sys.stdin)
          message = body["choices"][0]["message"]
          reasoning = message.get("reasoning_content")
          if reasoning:
              print("::error::model returned reasoning content; thinking is not suppressed")
              sys.exit(1)
          proposal = json.loads(message["content"])
          required = {"kind","candidateId","manufacturer","name","partNumber",
                      "barcode","variantAttributes","evidenceImageOrdinals"}
          missing = required - proposal.keys()
          if missing:
              print("::error::grammar omitted required fields: %s" % sorted(missing))
              sys.exit(1)
          if proposal["candidateId"] is not None:
              print("::error::candidateId was not null with an empty allowlist")
              sys.exit(1)
          print("constrained response carried all %d fields; kind=%s" % (len(required), proposal["kind"]))
          '

      - name: Smoke test the recognition-core runtime
        if: matrix.runtime == 'recognition-core'
        run: |
          container_id="$(docker run --detach --publish 18000:8000 stockcontrol-recognition-core:ci)"
          trap 'docker rm --force "$container_id" >/dev/null 2>&1 || true' EXIT

          curl --fail --silent --show-error --retry 20 --retry-all-errors \
            --retry-delay 1 http://127.0.0.1:18000/health/live

          # The image carries the weights models/manifest.lock.json pins, so a
          # ready service is the honest answer and this asserts something worth
          # asserting: that the manifest resolved to files the service could
          # actually load. A 503 here is what the Railway runbook tells an
          # operator to read as exactly that failure. This step used to require
          # the 503, from when the image shipped without weights; the
          # no-weights path, where 503 is correct, is covered by the service's
          # own tests rather than by this image.
          status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/health/ready)"
          if [ "$status" != "200" ]; then
            echo "readiness returned ${status}, expected 200" >&2
            exit 1
          fi

          docs_status="$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18000/docs)"
          test "$docs_status" = "404"

      # worker and recognition-fusion get no runtime smoke test here, unlike
      # web and recognition-core: worker's entrypoint requires a real
      # PostgreSQL to construct its connection pool, and recognition-fusion's
      # entrypoint refuses to start at all without real model files at
      # RECOGNITION_FUSION_MODEL_PATH/MMPROJ_PATH — neither exists in this
      # environment (models/manifest.lock.json lists none; see
      # docs/operations/railway-stock-capture.md). The generic checks above
      # — non-root user, the revision label, and the worker/recognition-fusion
      # file-existence checks — are what this job can honestly prove.

  # Proves the stock rules hold against a real database, including the
  # concurrent double collection that section 9 names specifically.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: stockcontrol_test
          POSTGRES_PASSWORD: stockcontrol_admin_test
          POSTGRES_USER: stockcontrol_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockcontrol_admin -d stockcontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_MIGRATOR_URL: postgresql://stockcontrol_migrator:stockcontrol_migrator_test@localhost:5432/stockcontrol_test
      DATABASE_RUNTIME_ROLE: stockcontrol_app
      DATABASE_URL: postgresql://stockcontrol_app:stockcontrol_app_test@localhost:5432/stockcontrol_test
      NODE_ENV: test

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      # Mirrors scripts/postgres/init/001_roles.sql, which compose runs locally.
      # The runtime role is separate from the migrator so the tests exercise the
      # same privilege boundary the demo runs behind.
      - name: Create the migration and runtime database roles
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1
          -U stockcontrol_admin
          -d stockcontrol_test
          -c "CREATE ROLE stockcontrol_migrator LOGIN PASSWORD 'stockcontrol_migrator_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; CREATE ROLE stockcontrol_app LOGIN PASSWORD 'stockcontrol_app_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; ALTER DATABASE stockcontrol_test OWNER TO stockcontrol_migrator; REVOKE ALL ON DATABASE stockcontrol_test FROM PUBLIC; REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE stockcontrol_test TO stockcontrol_app;"

      - name: Run integration tests against PostgreSQL
        run: pnpm run test:integration

  # The demo script itself, run in a browser against a seeded database. If this
  # job is green the demo can be given.
  demo-journey:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: stockcontrol_e2e
          POSTGRES_PASSWORD: stockcontrol_admin_e2e
          POSTGRES_USER: stockcontrol_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockcontrol_admin -d stockcontrol_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_MIGRATOR_URL: postgresql://stockcontrol_migrator:stockcontrol_migrator_e2e@localhost:5432/stockcontrol_e2e
      DATABASE_RUNTIME_ROLE: stockcontrol_app
      DATABASE_URL: postgresql://stockcontrol_app:stockcontrol_app_e2e@localhost:5432/stockcontrol_e2e
      NODE_ENV: test

    steps:
      - name: Check out the commit under test
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Create the migration and runtime database roles
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1
          -U stockcontrol_admin
          -d stockcontrol_e2e
          -c "CREATE ROLE stockcontrol_migrator LOGIN PASSWORD 'stockcontrol_migrator_e2e' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; CREATE ROLE stockcontrol_app LOGIN PASSWORD 'stockcontrol_app_e2e' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; ALTER DATABASE stockcontrol_e2e OWNER TO stockcontrol_migrator; REVOKE ALL ON DATABASE stockcontrol_e2e FROM PUBLIC; REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE stockcontrol_e2e TO stockcontrol_app;"

      # The same two commands the README gives a first-time reader.
      - name: Prepare the demo database
        run: |
          pnpm run db:migrate
          pnpm run db:seed

      - name: Install the Chromium test browser
        run: pnpm --filter @stockcontrol/e2e exec playwright install --with-deps chromium

      - name: Walk the demo journey in a browser
        run: pnpm run test:e2e

      - name: Publish the failure trace
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: demo-journey-failure-${{ github.sha }}
          path: |
            **/playwright-report/**
            **/test-results/**
          if-no-files-found: warn
          retention-days: 14
