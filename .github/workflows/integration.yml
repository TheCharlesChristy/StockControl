name: integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: stockcontrol_test
          POSTGRES_PASSWORD: stockcontrol_admin_test
          POSTGRES_USER: stockcontrol_admin
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockcontrol_admin -d stockcontrol_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_MIGRATOR_URL: postgresql://stockcontrol_migrator:stockcontrol_migrator_test@localhost:5432/stockcontrol_test
      DATABASE_RUNTIME_ROLE: stockcontrol_app
      DATABASE_URL: postgresql://stockcontrol_app:stockcontrol_app_test@localhost:5432/stockcontrol_test
      NODE_ENV: test

    steps:
      - name: Check out the release candidate
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.9.0
          run_install: false

      - name: Use Node.js 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Build reviewed backend artifacts
        run: pnpm run build:backend

      - name: Create separate migration and runtime database roles
        run: >-
          docker exec "${{ job.services.postgres.id }}"
          psql -v ON_ERROR_STOP=1
          -U stockcontrol_admin
          -d stockcontrol_test
          -c "CREATE ROLE stockcontrol_migrator LOGIN PASSWORD 'stockcontrol_migrator_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; CREATE ROLE stockcontrol_app LOGIN PASSWORD 'stockcontrol_app_test' NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT; ALTER DATABASE stockcontrol_test OWNER TO stockcontrol_migrator; REVOKE ALL ON DATABASE stockcontrol_test FROM PUBLIC; REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE stockcontrol_test TO stockcontrol_app;"

      - name: Run integration tests against PostgreSQL 18
        run: pnpm run test:integration

      - name: Create a role-isolated logical backup
        run: >-
          docker exec
          -e PGPASSWORD=stockcontrol_migrator_test
          "${{ job.services.postgres.id }}"
          pg_dump
          --host=127.0.0.1
          --format=custom
          --no-owner
          --no-privileges
          --username=stockcontrol_migrator
          --file=/tmp/stockcontrol.dump
          stockcontrol_test

      - name: Provision an empty restore target owned by the migrator
        run: |
          docker exec "${{ job.services.postgres.id }}" \
            createdb -U stockcontrol_admin -O stockcontrol_migrator stockcontrol_restore_test
          docker exec "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U stockcontrol_admin -d stockcontrol_restore_test \
            -c "REVOKE ALL ON DATABASE stockcontrol_restore_test FROM PUBLIC; REVOKE ALL ON SCHEMA public FROM PUBLIC; GRANT CONNECT ON DATABASE stockcontrol_restore_test TO stockcontrol_app;"

      - name: Restore while authenticated as the schema owner
        run: >-
          docker exec
          -e PGPASSWORD=stockcontrol_migrator_test
          "${{ job.services.postgres.id }}"
          pg_restore
          --host=127.0.0.1
          --exit-on-error
          --single-transaction
          --no-owner
          --no-privileges
          --username=stockcontrol_migrator
          --dbname=stockcontrol_restore_test
          /tmp/stockcontrol.dump

      - name: Re-run migrations and runtime checks after restore
        env:
          DATABASE_MIGRATOR_URL: postgresql://stockcontrol_migrator:stockcontrol_migrator_test@localhost:5432/stockcontrol_restore_test
          DATABASE_URL: postgresql://stockcontrol_app:stockcontrol_app_test@localhost:5432/stockcontrol_restore_test
        run: |
          node packages/platform/database/dist/migrate.js
          docker exec -e PGPASSWORD=stockcontrol_app_test "${{ job.services.postgres.id }}" \
            psql -v ON_ERROR_STOP=1 -U stockcontrol_app -d stockcontrol_restore_test \
            -c "BEGIN; INSERT INTO stockcontrol.system_metadata (key, value) VALUES ('restore.probe', '{\"source\":\"ci\"}'::jsonb); SELECT key FROM stockcontrol.system_metadata WHERE key = 'restore.probe'; DELETE FROM stockcontrol.system_metadata WHERE key = 'restore.probe'; COMMIT;"

      - name: Prove API readiness against the restored database
        env:
          APP_VERSION: restore-test
          DATABASE_URL: postgresql://stockcontrol_app:stockcontrol_app_test@localhost:5432/stockcontrol_restore_test
          GIT_SHA: restore-test
          HOST: 127.0.0.1
          PORT: 3000
        run: |
          pnpm --filter @stockcontrol/api start > api-restore.log 2>&1 &
          api_pid=$!
          trap 'kill "${api_pid}" 2>/dev/null || true' EXIT
          response="$(curl --fail --retry 30 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:3000/api/v1/health/ready)"
          HEALTH_RESPONSE="${response}" node -e \
            "const body = JSON.parse(process.env.HEALTH_RESPONSE); if (body.status !== 'ready' || body.checks?.some((check) => check.status !== 'ok')) process.exit(1);"
