server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Use Docker's embedded DNS resolver so the upstream hostname is resolved
    # at request time rather than at startup. This lets the container start
    # cleanly in environments where api.railway.internal is not yet resolvable
    # (e.g. CI contract tests that only exercise the /health endpoint).
    resolver 127.0.0.11 valid=30s ipv6=off;

    # The browser talks only to the web service. Forward API requests over
    # Railway's private network so session and CSRF cookies remain same-origin
    # and the API does not need a public domain.
    location /api/ {
        set $api_upstream http://api.railway.internal:3000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
