packages:
  - apps/*
  - packages/*
  - packages/modules/*
  - packages/platform/*

allowBuilds:
  "@nestjs/core": false
  "@scarf/scarf": false
  esbuild: true

catalog:
  "@vitest/coverage-v8": ^4.1.11
  typescript: ^5.9.3
  vitest: ^4.1.11

minimumReleaseAgeExclude:
  - jsdom@30.0.1

overrides:
  "@remix-run/router": 1.23.2
  "@nestjs/platform-fastify@11.1.28>find-my-way": 9.7.0
  # GHSA-7p8r-x3mc-p8w7: host confusion via a backslash authority introducer.
  # Fastify reaches both major lines transitively (ajv pins 3.x, fast-json-
  # stringify pins 4.x), so both need pinning to stay on the patched release.
  "fast-uri@<3.1.5": ^3.1.5
  "fast-uri@>=4.0.0 <4.1.2": ^4.1.2
  # GHSA for unbounded intermediate arrays; reached only through eslint.
  "brace-expansion@>=4.0.0 <5.0.9": ^5.0.9
  # GHSA-2v37-7h3g-55p8: a custom generator given size zero loops for ever.
  # Reached only as postcss's dependency under vite and vitest, so no runtime
  # code path touches it — but `pnpm audit --audit-level high` is a release
  # gate, and an unpatched high blocks every branch until it is pinned.
  "nanoid@<3.3.18": ^3.3.18

strictPeerDependencies: true
