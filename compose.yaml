name: stockcontrol

services:
  postgres:
    image: postgres:18.4-alpine
    environment:
      POSTGRES_DB: stockcontrol
      POSTGRES_PASSWORD: stockcontrol_admin
      POSTGRES_USER: stockcontrol_admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stockcontrol_admin -d stockcontrol"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./scripts/postgres/init:/docker-entrypoint-initdb.d:ro

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: stockcontrol
      MINIO_ROOT_PASSWORD: stockcontrol-local-only
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -ec
      - |
        until mc alias set local http://minio:9000 stockcontrol stockcontrol-local-only; do
          sleep 1
        done
        mc mb --ignore-existing local/stockcontrol-local

  mailpit:
    image: axllent/mailpit:v1.28.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  minio-data:
  postgres-data:
